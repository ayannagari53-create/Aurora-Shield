<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bgFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#bgFront)" />
  <circle cx="300" cy="180" r="140" fill="url(#sun)" />

  <!-- Britannia Ribbon -->
  <rect x="50" y="30" width="140" height="35" rx="5" fill="#dc2626" />
  <text x="120" y="54" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">BRITANNIA</text>

  <!-- Title -->
  <text x="300" y="130" font-family="'Outfit', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(2px 4px 6px rgba(0,0,0,0.5))">Good Day</text>
  <text x="300" y="170" font-family="'Outfit', sans-serif" font-size="24" font-weight="bold" fill="#fef08a" text-anchor="middle">BUTTER COOKIES</text>
  <text x="300" y="200" font-family="'Outfit', sans-serif" font-size="15" font-style="italic" fill="#ffffff" text-anchor="middle">Rich Butter Taste With A Smile :)</text>

  <!-- Cookie Illustration -->
  <circle cx="300" cy="270" r="45" fill="#d97706" stroke="#92400e" stroke-width="4"/>
  <path d="M280 260 Q300 285 320 260" stroke="#78350f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="285" cy="250" r="3" fill="#78350f"/>
  <circle cx="315" cy="250" r="3" fill="#78350f"/>

  <!-- Net Weight & MRP Highlights -->
  <rect x="40" y="330" width="160" height="45" rx="8" fill="rgba(0,0,0,0.6)" stroke="#fef08a" stroke-width="1.5"/>
  <text x="55" y="358" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" fill="#fef08a">Net Wt: 100g</text>

  <rect x="400" y="330" width="160" height="45" rx="8" fill="rgba(0,0,0,0.6)" stroke="#ffffff" stroke-width="1"/>
  <text x="415" y="358" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" fill="#ffffff">MRP: ₹ 30.00</text>

  <!-- Veg Icon -->
  <rect x="520" y="30" width="30" height="30" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="535" cy="45" r="8" fill="#16a34a"/>
</svg>
